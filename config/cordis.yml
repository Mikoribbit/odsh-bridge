# ODSH Bridge — Cordis merge snippet (reference only, ⚠️ not verified in a product environment)
#
# Usage: same `insert` merge syntax as DSH examples/mcp-memory/*.cordis.yml:
#   - merge this content into the DeepSeek Harness app's root cordis.yml (same-key merge), or
#   - patch it into your own deployment overlay; `name` is the module specifier
#     (a relative path or an npm package name).
#
# Note: the DSH root cordis.yml is a list of entries; the merge shape this example uses is:
#   - insert: [{ id, name, config }]
#
# Recommendation: first verify with a standalone process inside the DSH container (README "Quick start"),
# and only enable this plugin when you want it hosted by the DSH lifecycle.
- insert:
    - id: odsh-bridge
      name: './config/odsh-bridge'      # adjust the relative path to match your repository layout
      config:
        bridgePath: /root/ODSH-bridge    # must match the compose mount point
        intervalMs: 5000
        notify: false                    # only set to true after DISCORD_CHANNEL_ID is configured in .env