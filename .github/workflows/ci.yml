name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check (npm run check)
        run: npm run check

      - name: Security regression tests
        run: npm test

      - name: Bash syntax (setup-dsh.sh)
        run: bash -n scripts/setup-dsh.sh

      - name: Repo cleanliness (no .env / secrets left staged)
        run: |
          if [ -f .env ]; then echo '::error::.env present in workspace — secrets at risk'; exit 1; fi
          if git ls-files | grep -Eq '\.(env|jwk|device\.json)$' || [ -e DSH-Workspace ]; then
            echo '::error::tracked env/key/device files or DSH-Workspace found — block release files from repo'; exit 1;
          fi
