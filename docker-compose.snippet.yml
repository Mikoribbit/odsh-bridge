# ODSH Bridge — docker-compose snippet (bridge mount + agent-mesh network)
#
# Purpose: put both containers on the same agent-mesh network and mount the shared bridge into both sides
#   (equivalent to the verified environment's H:/ODSH-bridge -> /root/ODSH-bridge). This is a snippet:
#   replace image/command with your actual images.
#
# ⚠️ verify yourself: image and command depend on your DSH / OpenClaw images (the verified environment used
#   existing images; this snippet provides placeholders). The bridge host path can be overridden with the
#   ODSH_BRIDGE_HOST_DIR environment variable (default `H:/ODSH-bridge`, Docker Desktop Windows style;
#   pass an absolute path on Linux).
#
# Usage: docker compose -f docker-compose.snippet.yml up -d   (or merge into your main compose)

networks:
  agent-mesh:
    driver: bridge
    # if a network with this name already exists: use `name: agent-mesh` + external: true

services:
  # ---------- DSH: execution layer (the container where this repo's scripts run) ----------
  deepseek-harness:
    image: your-dsh-image:latest            # ⚠️ replace with your DSH image
    container_name: deepseek-harness
    networks: [agent-mesh]
    volumes:
      - ${ODSH_BRIDGE_HOST_DIR:-H:/ODSH-bridge}:/root/ODSH-bridge    # shared bridge (identical on both sides)
      - ./src:/opt/odsh-bridge/src:ro
      - ./.env:/opt/odsh-bridge/.env:ro
    # optional: keep the DSH container resident and host the daemon (command depends on your image entrypoint, ⚠️ verify yourself)
    # command: /bin/sh -c "cd /opt/odsh-bridge && node src/bridge-daemon.mjs --notify --interval-ms 5000 & exec /entrypoint.sh"

  # ---------- OpenClaw: brain/persona layer (with the 18789 gateway) ----------
  openclaw:
    image: your-openclaw-image:latest       # ⚠️ replace with your OpenClaw image
    container_name: openclaw
    networks: [agent-mesh]
    volumes:
      - ${ODSH_BRIDGE_HOST_DIR:-H:/ODSH-bridge}:/root/ODSH-bridge
    # gateway listens on 18789; origin allowlist see docs/PROTOCOL.md 2.1 (allowedOrigins must list
    # http://openclaw:18789, http://localhost:18789, etc.)